<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HexSplore</title>
    <link rel="stylesheet" href="style.css?v=4" />
  </head>
  <body>
    <canvas id="board"></canvas>

    <!-- Minimal floating HUD over the full-screen map -->
    <div class="hud" aria-label="Game statistics">
      <div class="hud-item">
        <span class="hud-label">Moves</span>
        <span class="hud-value" id="move-count">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Explored</span>
        <span class="hud-value" id="visited-count">1</span>
      </div>
      <button type="button" id="reset-button" class="hud-reset" title="Start over">Reset</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>

    <script src="game-core.js?v=4"></script>
    <script src="app.js?v=4"></script>
  </body>
</html>
