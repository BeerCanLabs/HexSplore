<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HexSplore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <!-- The field IS the game: a full-screen grassy square grid. -->
    <canvas id="board" aria-label="Grassy field"></canvas>

    <!-- Minimal floating HUD overlaid on the field. -->
    <div class="hud" role="group" aria-label="Game status">
      <div class="hud-stat">
        <span class="hud-label">Moves</span>
        <span class="hud-value" id="move-count">0</span>
      </div>
      <div class="hud-sep" aria-hidden="true"></div>
      <div class="hud-stat">
        <span class="hud-label">Explored</span>
        <span class="hud-value" id="visited-count">1</span>
      </div>
      <button type="button" id="reset-button" class="hud-reset" title="Start over">
        Reset
      </button>
    </div>

    <p id="status" class="status" aria-live="polite">
      Click a neighboring square to move your piece.
    </p>

    <script src="game-core.js?v=2"></script>
    <script src="app.js?v=2"></script>
  </body>
</html>
